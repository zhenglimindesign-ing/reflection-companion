<text x="40" y="48" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2" fill="#087f78">WEEKLY REVIEW</text>
<text x="40" y="92" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#1d1d1b">Not just what you did — which of your judgments changed this week</text>

<rect x="40" y="150" width="720" height="565" rx="14" fill="#fffefb"/>
<text x="62" y="182" font-family="Arial,sans-serif" font-size="13" fill="#6a6a64">Fictional example</text><text x="604" y="182" font-family="Arial,sans-serif" font-size="13" fill="#087f78">Reflection Companion</text>
<rect x="270" y="210" width="455" height="70" rx="12" fill="#e9e6de"/><text x="295" y="238" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">Review my week. Don’t just list what I did — look at which of my</text><text x="295" y="260" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">judgments changed.</text>
<circle cx="72" cy="320" r="16" fill="#087f78"/><text x="66" y="326" font-family="Arial,sans-serif" font-size="13" fill="white">R</text>
<text x="102" y="315" font-family="Arial,sans-serif" font-size="14" fill="#1d1d1b">I read 6 relevant conversations from this week (Sep 22–28), plus a correction you made on Sep 20.</text>
<rect x="105" y="350" width="620" height="310" rx="10" fill="#fff" stroke="#ddd9cf"/>
<rect x="105" y="350" width="620" height="42" rx="10" fill="#f8f6f0"/><text x="124" y="376" font-family="Arial,sans-serif" font-size="12" fill="#6a6a64">2025-W39 weekly review.md</text>
<text x="130" y="436" font-family="Georgia,serif" font-size="23" fill="#1d1d1b">Weekly review Sep 22–28 · Three people, as planned</text>
<text x="130" y="480" font-family="Arial,sans-serif" font-size="13" fill="#087f78">Facts</text><text x="178" y="480" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d1d1b">What happened</text>
<text x="130" y="512" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">Only three people signed up for book club and you nearly cancelled; it went ahead</text><text x="130" y="535" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">anyway. At work, a colleague read the demo’s main entry point differently.</text>
<text x="130" y="575" font-family="Arial,sans-serif" font-size="13" fill="#087f78">Shifts</text><text x="183" y="575" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d1d1b">What changed</text>
<text x="130" y="607" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">On Sep 22, a small turnout felt like failure. On Sep 24, you corrected yourself:</text><text x="150" y="635" font-family="Arial,sans-serif" font-size="15" fill="#6a6a64">“My worry is that the numbers look bad, not that nobody is interested.”</text>
<text x="40" y="760" font-family="Arial,sans-serif" font-size="13" fill="#6a6a64">Lighter — drop the observation　 ·　 That observation is wrong　 ·　 Make it read like prose</text>

<text x="130" y="436" font-family="Georgia,'Noto Serif SC',serif" font-size="24" fill="#1d1d1b">周回顾 9月22日–28日　三个人也照常</text>
<text x="130" y="480" font-family="Arial,sans-serif" font-size="13" fill="#087f78">Facts</text><text x="178" y="480" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d1d1b">这周发生了什么</text>
<text x="130" y="512" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">读书会只有三人报名，你一度想取消，后来照常办了。工作上，</text><text x="130" y="535" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">同事指出 demo 的主流程入口理解不同。</text>
<text x="130" y="575" font-family="Arial,sans-serif" font-size="13" fill="#087f78">Shifts</text><text x="183" y="575" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d1d1b">哪里变了</text>
<text x="130" y="607" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">9月22日，“人少”让你想到失败。9月24日，你自己改了说法：</text><text x="150" y="635" font-family="Arial,sans-serif" font-size="15" fill="#6a6a64">“我的担心是人数不好看，不是别人完全没兴趣。”</text>

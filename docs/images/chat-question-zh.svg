<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660">
<rect width="800" height="660" rx="18" fill="#f2efe8"/>
<text x="40" y="48" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2" fill="#087f78">不知道问什么</text>
<text x="40" y="92" font-family="Georgia,'Noto Serif SC',serif" font-size="27" font-weight="700" fill="#1d1d1b">不用想好问什么，它先给你一个问题，直接开始</text>

<rect x="40" y="150" width="720" height="430" rx="14" fill="#fffefb"/>
<text x="62" y="182" font-family="Arial,sans-serif" font-size="13" fill="#6a6a64">虚构示例</text><text x="604" y="182" font-family="Arial,sans-serif" font-size="13" fill="#087f78">Reflection Companion</text>
<rect x="405" y="210" width="320" height="56" rx="12" fill="#e9e6de"/><text x="428" y="244" font-family="Arial,sans-serif" font-size="16" fill="#1d1d1b">我不知道聊什么，你直接问我吧。</text>
<circle cx="72" cy="306" r="16" fill="#087f78"/><text x="66" y="312" font-family="Arial,sans-serif" font-size="13" fill="white">R</text>
<text x="102" y="301" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">好。我从内置探索库里选一个不需要历史的问题，直接开始。</text>
<rect x="104" y="330" width="620" height="92" rx="10" fill="#f8f6f0" stroke="#ddd9cf"/>
<text x="124" y="356" font-family="Arial,sans-serif" font-size="12" fill="#6a6a64">内置探索 · 一次好奇的采访 · 不需要历史</text>
<text x="124" y="394" font-family="Georgia,'Noto Serif SC',serif" font-size="20" fill="#1d1d1b">最近有没有一件你本来想做、后来没有做的事？</text>
<rect x="405" y="444" width="320" height="54" rx="12" fill="#e9e6de"/><text x="427" y="477" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">有。本来想约朋友去海边，但一直没约。</text>
<circle cx="72" cy="535" r="16" fill="#087f78"/><text x="66" y="541" font-family="Arial,sans-serif" font-size="13" fill="white">R</text>
<text x="102" y="540" font-family="Arial,sans-serif" font-size="15" fill="#1d1d1b">如果先不把它解释成“拖延”，当时真正让你停下来的是什么？</text>
<text x="40" y="620" font-family="Arial,sans-serif" font-size="13" fill="#6a6a64">换一个问题　 ·　 我想想再回答　 ·　 先到这里</text>
</svg>